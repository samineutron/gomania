<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GOMANÍA — Visor 3D Interactivo</title>

  <!-- Tailwind CSS para la barra flotante minimalista -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Tipografías redondeadas para acentos y UI -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Inter:wght@400;500;600;700;800&family=Oswald:wght@600;700&display=swap"
    rel="stylesheet"
  />

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      cursor: grab;
      touch-action: none;
    }

    #canvas-container:active {
      cursor: grabbing;
    }

    /* Deslizador suave de velocidad */
    input[type='range'].studio-slider {
      -webkit-appearance: none;
      appearance: none;
      height: 5px;
      border-radius: 9999px;
      background: #f5d0de;
      outline: none;
    }

    input[type='range'].studio-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 9999px;
      background: #e9557d;
      border: 2px solid #ffffff;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.22);
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    input[type='range'].studio-slider::-webkit-slider-thumb:hover {
      transform: scale(1.15);
    }

    input[type='range'].studio-slider::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border-radius: 9999px;
      background: #e9557d;
      border: 2px solid #ffffff;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.22);
      cursor: pointer;
    }

    #drag-hint {
      transition: opacity 0.6s ease;
    }
  </style>

  <!-- Import Map oficial de Three.js y sus controles -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>
</head>
<body class="bg-white text-slate-800 antialiased">
  <!-- Contenedor WebGL sobre fondo blanco puro -->
  <div id="canvas-container" aria-label="Visor 3D interactivo del paquete GOMANÍA"></div>

  <!-- Indicador de carga inicial -->
  <div
    id="loader"
    class="fixed inset-0 z-30 flex flex-col items-center justify-center bg-white transition-opacity duration-500"
  >
    <div class="w-9 h-9 rounded-full border-[3px] border-pink-100 border-t-[#E9557D] animate-spin mb-3"></div>
    <p class="text-xs font-medium tracking-wide text-slate-400">Generando empaque 3D GOMANÍA...</p>
  </div>

  <!-- Pista discreta superior -->
  <div
    id="drag-hint"
    class="fixed top-4 left-1/2 -translate-x-1/2 z-10 pointer-events-none px-3.5 py-1.5 rounded-full bg-white/85 backdrop-blur-sm border border-slate-200/70 text-[11px] font-medium text-slate-400 shadow-sm whitespace-nowrap"
  >
    Arrastra para girar 360° · Rueda o pellizco para zoom
  </div>

  <!-- Barra de control flotante minimalista -->
  <div class="fixed bottom-4 sm:bottom-5 left-1/2 -translate-x-1/2 z-20 max-w-[96vw]">
    <div
      class="flex flex-wrap items-center justify-center gap-1.5 sm:gap-2.5 px-3 sm:px-4 py-2 rounded-3xl sm:rounded-full bg-white/90 backdrop-blur-md border border-slate-200/80 shadow-[0_8px_30px_rgba(15,23,42,0.08)]"
    >
      <!-- Auto-rotar -->
      <button
        id="btn-autorotate"
        type="button"
        class="flex items-center gap-1.5 px-2.5 sm:px-3 py-1.5 rounded-full text-xs font-medium transition-all duration-200 bg-pink-50 text-[#D93D6B] border border-pink-200/80 hover:bg-pink-100/80 active:scale-95 cursor-pointer"
        title="Activar o desactivar rotación automática"
      >
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8" />
          <path d="M21 3v5h-5" />
        </svg>
        <span>Auto-rotar</span>
      </button>

      <!-- Pausar / Reanudar colores pastel -->
      <button
        id="btn-colors"
        type="button"
        class="flex items-center gap-1.5 px-2.5 sm:px-3 py-1.5 rounded-full text-xs font-medium transition-all duration-200 bg-slate-50 text-slate-700 border border-slate-200/80 hover:bg-slate-100 active:scale-95 cursor-pointer"
        title="Pausar o reanudar cambio de colores pastel en malvaviscos"
      >
        <svg id="icon-pause" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor">
          <rect x="6" y="4" width="4" height="16" rx="1.2" />
          <rect x="14" y="4" width="4" height="16" rx="1.2" />
        </svg>
        <svg id="icon-play" class="w-3.5 h-3.5 hidden" viewBox="0 0 24 24" fill="currentColor">
          <path d="M7 4.8v14.4c0 .8.9 1.3 1.6.9l11.2-7.2c.6-.4.6-1.4 0-1.8L8.6 3.9c-.7-.4-1.6.1-1.6.9z" />
        </svg>
        <span id="label-colors">Pausar</span>
      </button>

      <!-- Velocidad de colores -->
      <label class="flex items-center gap-1.5 px-1.5 py-1 text-xs font-medium text-slate-600">
        <span class="whitespace-nowrap text-[11px] text-slate-500">Velocidad</span>
        <input
          id="speed-slider"
          type="range"
          min="0.2"
          max="3.0"
          step="0.1"
          value="1.0"
          class="studio-slider w-16 sm:w-20"
          aria-label="Velocidad de cambio de colores pastel"
        />
      </label>

      <div class="hidden sm:block w-px h-4 bg-slate-200"></div>

      <!-- Vistas rápidas de cámara -->
      <div class="flex items-center gap-1">
        <button
          data-view="front"
          type="button"
          class="view-btn px-2.5 py-1.5 rounded-full text-[11px] font-semibold text-slate-600 bg-slate-50 border border-slate-200/70 hover:bg-slate-100 active:scale-95 transition cursor-pointer"
          title="Ver frente del paquete"
        >
          Frente
        </button>
        <button
          data-view="back"
          type="button"
          class="view-btn px-2.5 py-1.5 rounded-full text-[11px] font-semibold text-slate-600 bg-slate-50 border border-slate-200/70 hover:bg-slate-100 active:scale-95 transition cursor-pointer"
          title="Ver parte trasera"
        >
          Dorso
        </button>
        <button
          data-view="bottom"
          type="button"
          class="view-btn px-2.5 py-1.5 rounded-full text-[11px] font-semibold text-slate-600 bg-slate-50 border border-slate-200/70 hover:bg-slate-100 active:scale-95 transition cursor-pointer"
          title="Ver fuelle inferior celeste"
        >
          Base
        </button>
        <button
          data-view="reset"
          type="button"
          class="view-btn p-1.5 rounded-full text-slate-500 bg-slate-50 border border-slate-200/70 hover:bg-slate-100 hover:text-slate-800 active:scale-95 transition cursor-pointer"
          title="Restablecer vista inicial"
          aria-label="Restablecer vista"
        >
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 3-6.7L3 8" />
            <path d="M3 3v5h5" />
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Escena 3D en ES Modules -->
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    // =========================================================================
    // 1. CONSTANTES DE DISEÑO Y GEOMETRÍA DEL DOYPACK GOMANÍA (120mm × 195mm)
    // =========================================================================
    const BRAND = {
      pinkBg: '#EC5D88',
      pinkRich: '#E75280',
      pinkStripeLight: '#F8C5D6',
      pinkLogo: '#E9557D',
      cyan: '#0093C4',
      white: '#FFFFFF'
    };

    const POUCH = {
      W: 2.4,              // Ancho 3D (proporción 120mm)
      H: 3.9,              // Alto 3D (proporción 195mm)
      halfW: 1.2,
      halfH: 1.95,
      maxHalfZ: 0.52,      // Semiprofundidad máxima en el vientre inferior (espesor ~1.04)
      sealHalfZ: 0.015,    // Semiespesor de los sellados térmicos planos
      sideSealNx: 0.88,    // A partir de |nx| > 0.88 los bordes son planos sellados
      topBellyNy: 0.68,    // A partir de ny > 0.68 comienza la zona plana de cremallera y cabezal
      zipNy: 0.725,        // Línea de cremallera resellable (zipper)
      notchNy: 0.79,       // Muescas de apertura en V
      euroHoleV: 0.935,    // Centro vertical de la perforación Euro-slot (sombrero)
      gussetArchMax: 0.25, // Altura del arco interior del fuelle inferior celeste
      // Insignia circular "Empresa Fundada por Mujeres" (en coordenadas UV 0..1)
      badge: {
        u: 0.215,
        v: 0.168,
        rU: 0.088
      }
    };

    // Paleta estrictamente pastel y luminosa SOLO para los malvaviscos
    const PASTEL_PALETTE = [
      new THREE.Color('#B8F3D8'), // Verde menta pastel
      new THREE.Color('#FFC7DF'), // Rosado pastel
      new THREE.Color('#FFF1B5'), // Amarillo pastel
      new THREE.Color('#BFE8FF'), // Celeste pastel
      new THREE.Color('#E3CEFF'), // Lavanda pastel
      new THREE.Color('#FFD9BE'), // Durazno pastel
      new THREE.Color('#FFF8E6')  // Crema vainilla
    ];

    const state = {
      autoRotate: true,
      animateColors: true,
      colorSpeed: 1.0,
      colorTime: 0,
      cameraAnim: null
    };

    // =========================================================================
    // 2. FUNCIÓN MATEMÁTICA COMPARTIDA DE LA SUPERFICIE DEL PAQUETE
    //    Garantiza 100% coherencia entre frente, dorso, fuelle y malvaviscos.
    // =========================================================================

    /**
     * Devuelve la semiprofundidad Z del paquete en coordenadas normalizadas:
     * nx en [-1, 1] (izquierda a derecha en el frente)
     * ny en [-1, 1] (base inferior a borde superior)
     */
    function getPouchHalfDepth(nx, ny) {
      const absNx = Math.abs(nx);
      let belly = 0;

      if (absNx < POUCH.sideSealNx && ny >= -1.0 && ny < POUCH.topBellyNy) {
        const tx = absNx / POUCH.sideSealNx; // 0 en centro .. 1 en sellado lateral
        const hx = Math.pow(Math.cos(tx * Math.PI * 0.5), 0.56);

        const ty = (ny + 1.0) / (POUCH.topBellyNy + 1.0); // 0 en base .. 1 en zona de cremallera
        let hy;
        if (ty < 0.27) {
          // Base ancha del stand-up pouch que se apoya sobre el fuelle celeste
          const k = ty / 0.27;
          hy = 0.78 + 0.22 * Math.sin(k * Math.PI * 0.5);
        } else {
          // Estrechamiento orgánico hacia la zona plana superior del cierre
          const k = (ty - 0.27) / 0.73;
          hy = Math.pow(Math.cos(k * Math.PI * 0.5), 1.42);
        }

        // Micro-ondulación realista de lámina flexible sin afectar la contención
        const flex = 0.0028 * Math.sin(nx * Math.PI * 2.5 + ty * 3.8) * hx * hy;
        belly = POUCH.maxHalfZ * hx * hy + flex;
      }

      // Relieve horizontal sutil del cierre resellable (zip-lock)
      let zipRidge = 0;
      if (absNx < POUCH.sideSealNx * 1.02) {
        const edgeFade = Math.min(1, Math.max(0, (POUCH.sideSealNx * 1.02 - absNx) / 0.05));
        const d1 = (ny - (POUCH.zipNy - 0.011)) / 0.0085;
        const d2 = (ny - (POUCH.zipNy + 0.011)) / 0.0085;
        zipRidge = (Math.exp(-d1 * d1) * 0.0105 + Math.exp(-d2 * d2) * 0.009) * edgeFade;
      }

      return POUCH.sealHalfZ + Math.max(0, belly) + zipRidge;
    }

    /**
     * Coordenadas 3D locales (x, y) en el sistema centrado del paquete
     * x ∈ [-1.2, 1.2], y ∈ [-1.95, 1.95], incluyendo muescas en V y esquinas redondeadas.
     */
    function getPouchLocalXY(nx, ny) {
      let x = nx * POUCH.halfW;
      let y = ny * POUCH.halfH;

      // Muescas de apertura en V en los bordes izquierdo y derecho debajo del cabezal
      const dNotch = Math.abs(ny - POUCH.notchNy);
      if (dNotch < 0.022 && Math.abs(nx) > 0.91) {
        const notchFactor = 1.0 - dNotch / 0.022;
        const edgeFactor = (Math.abs(nx) - 0.91) / 0.09;
        x -= Math.sign(nx) * 0.068 * notchFactor * edgeFactor;
      }

      // Redondeado suave en las 4 esquinas exteriores del envase
      if (Math.abs(ny) > 0.94 && Math.abs(nx) > 0.90) {
        const ty = (Math.abs(ny) - 0.94) / 0.06;
        const tx = (Math.abs(nx) - 0.90) / 0.10;
        const inset = (1.0 - Math.sqrt(Math.max(0, 1.0 - ty * ty))) * 0.032 * tx;
        x -= Math.sign(nx) * inset;
      }

      return { x, y };
    }

    /**
     * Altura Y local del pliegue interior del fuelle celeste en (nx, s) con s ∈ [0, 1].
     */
    function getGussetLocalY(nx, s) {
      const absNx = Math.abs(nx);
      if (absNx >= POUCH.sideSealNx) return -POUCH.halfH;
      const tx = absNx / POUCH.sideSealNx;
      const archX = Math.pow(Math.cos(tx * Math.PI * 0.5), 0.62);
      const archZ = Math.sin(s * Math.PI);
      return -POUCH.halfH + POUCH.gussetArchMax * archX * archZ;
    }

    // =========================================================================
    // 3. TRAZADOS COMPARTIDOS DE RECORTE: VENTANA RIÑÓN Y EURO-SLOT SOMBRERO
    // =========================================================================

    /**
     * Traza la ventana transparente en forma de frijol / sonrisa ancha curva
     * en la parte inferior-izquierda/centro del frente, dejando totalmente libre "80gr" a la derecha.
     */
    function traceKidneyWindow2D(ctx, W, H, scale = 1.0) {
      // Centro ligeramente a la izquierda (u = 0.445) para que termine en u ~ 0.725 y deje "80gr" libre en u ~ 0.835
      const cx = 0.445 * W;
      const cy = (1.0 - 0.258) * H; // v ≈ 0.258
      const rx = 0.285 * W * scale;
      const ry = 0.128 * H * scale;

      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(0.03); // Leve inclinación orgánica como en el troquel real
      ctx.beginPath();
      // Contorno cerrado tipo riñón / sonrisa dulce con curva superior suavemente cóncava-plana y base amplia redondeada
      ctx.moveTo(-rx * 0.88, -ry * 0.56);
      // Borde superior: curva suave estilo sonrisa / frijol
      ctx.bezierCurveTo(-rx * 0.42, -ry * 1.02, rx * 0.36, -ry * 0.94, rx * 0.86, -ry * 0.44);
      // Lóbulo derecho bien redondeado (termina limpiamente antes de "80gr")
      ctx.bezierCurveTo(rx * 1.08, -ry * 0.08, rx * 1.02, ry * 0.62, rx * 0.60, ry * 0.90);
      // Curva inferior amplia y mullida
      ctx.bezierCurveTo(rx * 0.14, ry * 1.12, -rx * 0.42, ry * 1.12, -rx * 0.78, ry * 0.82);
      // Lóbulo izquierdo redondeado
      ctx.bezierCurveTo(-rx * 1.10, ry * 0.50, -rx * 1.12, -ry * 0.18, -rx * 0.88, -ry * 0.56);
      ctx.closePath();
      ctx.restore();
    }

    /**
     * Genera los puntos (u, v) del contorno de la perforación superior Euro-slot (sombrero),
     * compartidos tanto por el recorte alfa 2D como por el borde interior 3D del agujero.
     */
    function getEuroHolePointsUV() {
      const cx = 0.5;
      const cyV = POUCH.euroHoleV; // 0.935 en V (arriba)
      const aspect = POUCH.W / POUCH.H; // 0.6154

      // Dimensiones en unidades de U (normalizadas al ancho)
      const slotHalfW = 0.118;
      const slotHalfH = 0.021;
      const topBulgeR = 0.036;
      const pts = [];

      const addPt = (du, dvU) => {
        pts.push({ u: cx + du, v: cyV + dvU * aspect });
      };

      // Tapa redondeada derecha de la ranura horizontal
      for (let i = 0; i <= 10; i++) {
        const a = -Math.PI * 0.5 + (i / 10) * Math.PI;
        addPt((slotHalfW - slotHalfH) + Math.cos(a) * slotHalfH, Math.sin(a) * slotHalfH);
      }

      // Arco central superior tipo sombrero
      const neckX = topBulgeR * 0.88;
      addPt(neckX + 0.008, slotHalfH);
      for (let i = 0; i <= 16; i++) {
        const a = 0.18 + (i / 16) * (Math.PI - 0.36);
        addPt(Math.cos(a) * topBulgeR, slotHalfH + Math.sin(a) * (topBulgeR * 0.92));
      }
      addPt(-neckX - 0.008, slotHalfH);

      // Tapa redondeada izquierda de la ranura horizontal
      for (let i = 0; i <= 10; i++) {
        const a = Math.PI * 0.5 + (i / 10) * Math.PI;
        addPt(-(slotHalfW - slotHalfH) + Math.cos(a) * slotHalfH, Math.sin(a) * slotHalfH);
      }

      return pts;
    }

    /**
     * Traza la perforación Euro-slot en un contexto Canvas 2D.
     */
    function traceEuroHole2D(ctx, W, H) {
      const pts = getEuroHolePointsUV();
      ctx.beginPath();
      pts.forEach((p, idx) => {
        const px = p.u * W;
        const py = (1.0 - p.v) * H;
        if (idx === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      });
      ctx.closePath();
    }

    // =========================================================================
    // 4. RECREACIÓN VECTORIAL FIEL DEL LOGO "GOMANÍA" (SEGÚN REFERENCIA 681.PNG)
    // =========================================================================

    /**
     * Traza el adorable recorte blanco con forma de corazón-frijol (bean-heart)
     * usado en el centro de la "o" y de ambas letras "A".
     */
    function traceBeanHeartPath(ctx, cx, cy, rx, ry) {
      ctx.beginPath();
      ctx.moveTo(cx, cy - ry * 0.52);
      // Lóbulo derecho superior y costado regordete
      ctx.bezierCurveTo(cx + rx * 0.55, cy - ry * 1.05, cx + rx * 1.12, cy - ry * 0.35, cx + rx * 0.86, cy + ry * 0.35);
      // Parte inferior redondeada hacia el centro
      ctx.bezierCurveTo(cx + rx * 0.60, cy + ry * 0.92, cx + rx * 0.18, cy + ry * 1.02, cx, cy + ry * 1.02);
      // Parte inferior izquierda
      ctx.bezierCurveTo(cx - rx * 0.18, cy + ry * 1.02, cx - rx * 0.60, cy + ry * 0.92, cx - rx * 0.86, cy + ry * 0.35);
      // Lóbulo izquierdo superior regresando a la hendidura superior
      ctx.bezierCurveTo(cx - rx * 1.12, cy - ry * 0.35, cx - rx * 0.55, cy - ry * 1.05, cx, cy - ry * 0.52);
      ctx.closePath();
    }

    /**
     * Dibuja el logotipo oficial GOMANÍA usando trazados vectoriales puros Canvas2D
     * (sin fuentes genéricas para GOM / ANÍA), con contorno blanco grueso troquelado.
     */
    function drawGomaniaVectorLogo(ctx, centerX, centerY, scale = 1.0, tiltRad = -0.05) {
      ctx.save();
      ctx.translate(centerX, centerY);
      ctx.rotate(tiltRad);
      ctx.scale(scale, scale);

      // --- Trazados vectoriales exactos de cada letra (sistema local ~860 × 760) ---

      // 1. Letra "G" (celeste #0093C4) — bloque grueso redondeado con muesca interna recta
      const pathG = () => {
        ctx.beginPath();
        ctx.moveTo(-142, -334);
        // Techo ancho suavemente arqueado hacia la izquierda
        ctx.bezierCurveTo(-225, -354, -345, -340, -372, -268);
        // Espalda izquierda gruesa y curva
        ctx.bezierCurveTo(-396, -204, -384, -108, -338, -74);
        // Base ancha redondeada hacia la derecha
        ctx.bezierCurveTo(-290, -40, -195, -52, -135, -80);
        // Subida recta por el borde derecho inferior hasta la barra horizontal
        ctx.lineTo(-140, -214);
        // Barra horizontal interior de la G
        ctx.lineTo(-244, -198);
        // Bajada interior corta y redondeada
        ctx.lineTo(-238, -138);
        // Vuelta hacia la izquierda en la cavidad interna
        ctx.bezierCurveTo(-258, -135, -264, -158, -264, -194);
        ctx.bezierCurveTo(-264, -234, -248, -252, -198, -248);
        // Regreso hacia la derecha al borde superior de la abertura
        ctx.lineTo(-146, -240);
        ctx.closePath();
      };

      // 2. Letra "o" (rosa coral #E9557D) — squircle vertical gordito entre G y M
      const pathO = () => {
        ctx.beginPath();
        ctx.moveTo(-36, -254);
        ctx.bezierCurveTo(26, -256, 48, -222, 50, -162);
        ctx.bezierCurveTo(52, -100, 30, -70, -30, -68);
        ctx.bezierCurveTo(-94, -66, -114, -98, -114, -160);
        ctx.bezierCurveTo(-114, -224, -92, -252, -36, -254);
        ctx.closePath();
      };

      // 3. Letra "M" (celeste #0093C4) — bloque robusto con valle en V central
      const pathM = () => {
        ctx.beginPath();
        // Esquina superior izquierda
        ctx.moveTo(74, -330);
        ctx.quadraticCurveTo(136, -342, 198, -330);
        // Bajada al valle superior de la M
        ctx.lineTo(222, -232);
        // Subida a la cima derecha
        ctx.lineTo(246, -332);
        ctx.quadraticCurveTo(312, -332, 368, -308);
        // Columna derecha bajando firme
        ctx.lineTo(364, -62);
        ctx.lineTo(272, -66);
        // Interior derecho subiendo hacia el triángulo bajo la M
        ctx.lineTo(270, -172);
        ctx.lineTo(216, -106);
        ctx.lineTo(166, -174);
        // Columna izquierda bajando firme
        ctx.lineTo(166, -70);
        ctx.lineTo(72, -72);
        ctx.closePath();
      };

      // 4. Primera letra "A" (rosa coral #E9557D) — bloque trapezoidal gordito
      const pathA1 = () => {
        ctx.beginPath();
        ctx.moveTo(-314, -32);
        ctx.quadraticCurveTo(-258, -44, -200, -24);
        ctx.lineTo(-158, 194);
        ctx.lineTo(-244, 194);
        // Muesca inferior entre patas
        ctx.lineTo(-246, 162);
        ctx.lineTo(-274, 164);
        ctx.lineTo(-276, 198);
        ctx.lineTo(-358, 214);
        ctx.closePath();
      };

      // 5. Letra "N" (celeste #0093C4) — bloque ancho con muescas limpias
      const pathN = () => {
        ctx.beginPath();
        ctx.moveTo(-136, -24);
        ctx.quadraticCurveTo(-102, -32, -64, -24);
        // Muesca superior izquierda hacia la diagonal
        ctx.lineTo(-36, 56);
        ctx.lineTo(-32, -20);
        ctx.quadraticCurveTo(8, -28, 46, -16);
        // Columna derecha completa
        ctx.lineTo(42, 232);
        ctx.lineTo(-38, 224);
        // Muesca inferior entre diagonal y pata izquierda
        ctx.lineTo(-64, 152);
        ctx.lineTo(-68, 214);
        ctx.lineTo(-138, 206);
        ctx.closePath();
      };

      // 6. Tallo vertical de la "Í" (celeste #0093C4)
      const pathIStem = () => {
        ctx.beginPath();
        ctx.moveTo(78, 56);
        ctx.quadraticCurveTo(118, 48, 158, 56);
        ctx.lineTo(158, 250);
        ctx.lineTo(84, 244);
        ctx.closePath();
      };

      // 7. Tilde / acento tipo gomita frijol encima de la "Í" (celeste #0093C4)
      const pathIBean = () => {
        ctx.beginPath();
        ctx.moveTo(132, -46);
        ctx.bezierCurveTo(164, -56, 180, -20, 162, 12);
        ctx.bezierCurveTo(144, 42, 102, 50, 82, 34);
        ctx.bezierCurveTo(68, 22, 74, 2, 94, -4);
        ctx.bezierCurveTo(114, -10, 118, -24, 122, -36);
        ctx.bezierCurveTo(124, -42, 128, -45, 132, -46);
        ctx.closePath();
      };

      // 8. Segunda letra "A" (rosa coral #E9557D) — más alta y dinámica a la derecha
      const pathA2 = () => {
        ctx.beginPath();
        ctx.moveTo(214, -36);
        ctx.quadraticCurveTo(282, -52, 346, -34);
        ctx.lineTo(422, 224);
        ctx.lineTo(330, 248);
        // Muesca inferior entre patas
        ctx.lineTo(320, 198);
        ctx.lineTo(292, 202);
        ctx.lineTo(296, 252);
        ctx.lineTo(198, 256);
        ctx.closePath();
      };

      // 9. Cinta ondulada celeste debajo de ANÍA
      const pathWaveRibbon = () => {
        ctx.beginPath();
        // Borde superior de la onda (izquierda -> derecha)
        ctx.moveTo(-348, 244);
        ctx.bezierCurveTo(-190, 200, -50, 272, 130, 294);
        ctx.bezierCurveTo(270, 310, 368, 286, 440, 246);
        // Remate derecho inclinado
        ctx.lineTo(466, 298);
        // Borde inferior de la onda (derecha -> izquierda)
        ctx.bezierCurveTo(378, 346, 260, 368, 114, 348);
        ctx.bezierCurveTo(-60, 322, -196, 238, -342, 274);
        ctx.closePath();
      };

      // Curva paramétrica para posicionar cada letra de "MAS DE 100 SABORES" bajo la onda
      const taglineText = 'MAS DE 100 SABORES';
      const getTaglineTransform = (u) => {
        // Curva que sigue fielmente el borde inferior de pathWaveRibbon
        const x = -318 + u * 756;
        const y = 328 - Math.sin(u * Math.PI * 1.15 + 0.55) * -18 + Math.sin((u - 0.12) * Math.PI) * 58 + (u > 0.5 ? (u - 0.5) * 18 : 0);
        return { x, y };
      };

      const drawTaglineLetters = (isOutline) => {
        ctx.font = '700 66px "Fredoka", "Inter", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const chars = taglineText.split('');
        const total = chars.length - 1;

        for (let i = 0; i < chars.length; i++) {
          const ch = chars[i];
          if (ch === ' ') continue;
          const u = i / total;
          const p0 = getTaglineTransform(Math.max(0, u - 0.02));
          const p1 = getTaglineTransform(Math.min(1, u + 0.02));
          const pos = getTaglineTransform(u);
          const angle = Math.atan2(p1.y - p0.y, p1.x - p0.x);

          ctx.save();
          ctx.translate(pos.x, pos.y);
          ctx.rotate(angle);
          if (isOutline) {
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            ctx.lineWidth = 66;
            ctx.strokeStyle = BRAND.white;
            ctx.strokeText(ch, 0, 0);
            ctx.fillStyle = BRAND.white;
            ctx.fillText(ch, 0, 0);
          } else {
            ctx.lineJoin = 'round';
            ctx.lineWidth = 5;
            ctx.strokeStyle = BRAND.cyan;
            ctx.strokeText(ch, 0, 0);
            ctx.fillStyle = BRAND.cyan;
            ctx.fillText(ch, 0, 0);
          }
          ctx.restore();
        }
      };

      const allLetterPaths = [pathG, pathO, pathM, pathA1, pathN, pathIStem, pathIBean, pathA2, pathWaveRibbon];

      // =====================================================================
      // CAPA 1: CONTORNO BLANCO TROQUELADO CONTINUO (SIN HUECOS INTERNOS)
      // =====================================================================
      ctx.save();
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      ctx.fillStyle = BRAND.white;
      ctx.strokeStyle = BRAND.white;

      // Puentes blancos suaves en el interior del bloque para evitar micro-huecos rosas
      ctx.beginPath();
      ctx.roundRect(-340, -255, 695, 495, 95);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(-340, 175);
      ctx.bezierCurveTo(-120, 170, 180, 225, 420, 200);
      ctx.lineTo(445, 345);
      ctx.bezierCurveTo(180, 415, -120, 345, -335, 330);
      ctx.closePath();
      ctx.fill();

      // Contorno grueso uniforme alrededor de cada silueta vectorial
      ctx.lineWidth = 74;
      allLetterPaths.forEach((drawFn) => {
        drawFn();
        ctx.stroke();
        ctx.fill();
      });

      // Contorno blanco continuo para "MAS DE 100 SABORES"
      drawTaglineLetters(true);
      ctx.restore();

      // =====================================================================
      // CAPA 2: RELLENOS VECTORIALES DE MARCA (#0093C4 Y #E9557D)
      // =====================================================================
      const fillShape = (drawFn, color) => {
        drawFn();
        ctx.fillStyle = color;
        ctx.fill();
      };

      fillShape(pathG, BRAND.cyan);
      fillShape(pathO, BRAND.pinkLogo);
      fillShape(pathM, BRAND.cyan);

      fillShape(pathA1, BRAND.pinkLogo);
      fillShape(pathN, BRAND.cyan);
      fillShape(pathIStem, BRAND.cyan);
      fillShape(pathIBean, BRAND.cyan);
      fillShape(pathA2, BRAND.pinkLogo);

      fillShape(pathWaveRibbon, BRAND.cyan);

      // =====================================================================
      // CAPA 3: DETALLES INTERNOS BLANCOS (CORAZONES-FRIJOL Y BRILLO EN Í)
      // =====================================================================
      ctx.fillStyle = BRAND.white;

      // Corazón-frijol blanco en "o"
      traceBeanHeartPath(ctx, -31, -155, 42, 34);
      ctx.fill();

      // Corazón-frijol blanco en primera "A"
      traceBeanHeartPath(ctx, -258, 72, 42, 33);
      ctx.fill();

      // Corazón-frijol blanco en segunda "A"
      traceBeanHeartPath(ctx, 298, 102, 54, 42);
      ctx.fill();

      // Pequeño brillo curvo blanco en el borde interno derecho de la tilde gomita de la "Í"
      ctx.save();
      ctx.strokeStyle = BRAND.white;
      ctx.lineWidth = 7;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(152, -26);
      ctx.bezierCurveTo(160, -10, 152, 10, 134, 22);
      ctx.stroke();
      ctx.restore();

      // Texto "MAS DE 100 SABORES" en celeste siguiendo exactamente la onda
      drawTaglineLetters(false);

      ctx.restore();
    }

    // =========================================================================
    // 5. TEXTURAS DE ALTA RESOLUCIÓN 2048×3072 (FRENTE, DORSO Y FUELLE AZUL)
    // =========================================================================

    /**
     * Dibuja un corazón clásico limpio para el sello de mujeres y detalles.
     */
    function drawHeart(ctx, cx, cy, size, color) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.beginPath();
      ctx.moveTo(0, size * 0.42);
      ctx.bezierCurveTo(-size * 0.65, -size * 0.05, -size * 0.58, -size * 0.72, 0, -size * 0.25);
      ctx.bezierCurveTo(size * 0.58, -size * 0.72, size * 0.65, -size * 0.05, 0, size * 0.42);
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.fill();
      ctx.restore();
    }

    /**
     * Dibuja texto curvado sobre un círculo.
     */
    function drawCurvedText(ctx, text, cx, cy, radius, startAngle, endAngle, flipBottom = false) {
      ctx.save();
      ctx.translate(cx, cy);
      const chars = text.split('');
      const denom = Math.max(1, chars.length - 1);
      chars.forEach((ch, idx) => {
        const t = chars.length === 1 ? 0.5 : idx / denom;
        const a = startAngle + (endAngle - startAngle) * t;
        ctx.save();
        ctx.rotate(a);
        ctx.translate(0, flipBottom ? radius : -radius);
        ctx.fillText(ch, 0, 0);
        ctx.restore();
      });
      ctx.restore();
    }

    /**
     * Dibuja el fondo rosa caramelo del paquete con garabatos lineales blancos de gomitas,
     * toldo festoneado superior e inferior y línea visual de cremallera.
     */
    function drawCandyPouchBackground(ctx, W, H, seedVal = 17) {
      // Base rosa vibrante saturado calibrado para estudio
      const grad = ctx.createLinearGradient(0, 0, W, H);
      grad.addColorStop(0, '#EE5D8A');
      grad.addColorStop(0.5, '#EC5886');
      grad.addColorStop(1, '#E44E7C');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);

      // Garabatos blancos semitransparentes de golosinas (gusanitos, frijoles, aros, frutillas, corazones)
      ctx.save();
      ctx.strokeStyle = 'rgba(255, 232, 240, 0.36)';
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      let s = seedVal;
      const rand = () => {
        s = (s * 16807) % 2147483647;
        return (s - 1) / 2147483646;
      };

      for (let i = 0; i < 82; i++) {
        const dx = W * (0.04 + rand() * 0.92);
        const dy = H * (0.14 + rand() * 0.76);
        const rot = rand() * Math.PI * 2;
        const sc = 0.7 + rand() * 0.85;
        const kind = i % 6;

        ctx.save();
        ctx.translate(dx, dy);
        ctx.rotate(rot);
        ctx.scale(sc, sc);
        ctx.lineWidth = 4.6;

        if (kind === 0) {
          // Gomita frijol (jelly bean)
          ctx.beginPath();
          ctx.moveTo(-28, 0);
          ctx.bezierCurveTo(-30, -26, 28, -28, 30, -2);
          ctx.bezierCurveTo(32, 22, 4, 24, -4, 13);
          ctx.bezierCurveTo(-12, 24, -26, 18, -28, 0);
          ctx.closePath();
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(-8, -7, 7, Math.PI, Math.PI * 1.6);
          ctx.stroke();
        } else if (kind === 1) {
          // Gusanito de gomita segmentado
          for (let seg = -36; seg <= 36; seg += 13) {
            const sy = Math.sin(seg * 0.065) * 9;
            ctx.beginPath();
            ctx.ellipse(seg, sy, 9, 14, 0.25, 0, Math.PI * 2);
            ctx.stroke();
          }
        } else if (kind === 2) {
          // Aro de gomita
          ctx.beginPath();
          ctx.arc(0, 0, 24, 0, Math.PI * 2);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(0, 0, 10, 0, Math.PI * 2);
          ctx.stroke();
        } else if (kind === 3) {
          // Frutilla de gomita
          ctx.beginPath();
          ctx.moveTo(0, -24);
          ctx.quadraticCurveTo(28, -12, 18, 22);
          ctx.quadraticCurveTo(0, 30, -18, 22);
          ctx.quadraticCurveTo(-28, -12, 0, -24);
          ctx.stroke();
          for (let p = 0; p < 5; p++) {
            ctx.beginPath();
            ctx.arc((p - 2) * 7, (p % 2) * 8 - 2, 2.0, 0, Math.PI * 2);
            ctx.stroke();
          }
        } else if (kind === 4) {
          // Corazón lineal
          ctx.beginPath();
          ctx.moveTo(0, 16);
          ctx.bezierCurveTo(-26, -4, -22, -26, 0, -10);
          ctx.bezierCurveTo(22, -26, 26, -4, 0, 16);
          ctx.stroke();
        } else {
          // Espiral de caramelo
          ctx.beginPath();
          for (let a = 0; a < Math.PI * 4.5; a += 0.3) {
            const r = 2 + a * 1.7;
            const px = Math.cos(a) * r;
            const py = Math.sin(a) * r;
            if (a === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.stroke();
        }
        ctx.restore();
      }
      ctx.restore();

      // Rayas de toldo superior alternando rosa vivo y rosa pastel (#F8C5D6)
      const numStripes = 11;
      const stripeW = W / numStripes;
      const topStraightH = H * 0.145;
      const rArc = stripeW * 0.5;

      for (let i = 0; i < numStripes; i++) {
        const sx = i * stripeW;
        const isLight = i % 2 === 1;
        ctx.fillStyle = isLight ? BRAND.pinkStripeLight : '#EE6A94';
        ctx.beginPath();
        ctx.moveTo(sx, 0);
        ctx.lineTo(sx + stripeW, 0);
        ctx.lineTo(sx + stripeW, topStraightH);
        ctx.arc(sx + rArc, topStraightH, rArc, 0, Math.PI, false);
        ctx.closePath();
        ctx.fill();
      }

      // Rayas festoneadas inferiores
      const botStartY = H * 0.912;
      for (let i = 0; i < numStripes; i++) {
        const sx = i * stripeW;
        const isLight = i % 2 === 1;
        ctx.fillStyle = isLight ? BRAND.pinkStripeLight : '#EE6A94';
        ctx.beginPath();
        ctx.moveTo(sx, H);
        ctx.lineTo(sx, botStartY);
        ctx.arc(sx + rArc, botStartY, rArc, Math.PI, 0, false);
        ctx.lineTo(sx + stripeW, H);
        ctx.closePath();
        ctx.fill();
      }

      // Línea sutil del cierre resellable (zipper)
      const zipV = (POUCH.zipNy + 1) * 0.5;
      const zipY = (1 - zipV) * H;
      ctx.fillStyle = 'rgba(255, 255, 255, 0.24)';
      ctx.fillRect(W * 0.06, zipY - 9, W * 0.88, 5);
      ctx.fillStyle = 'rgba(170, 35, 80, 0.18)';
      ctx.fillRect(W * 0.06, zipY + 3, W * 0.88, 6);

      // Sombra sutil en los bordes laterales termosellados
      const leftGrad = ctx.createLinearGradient(0, 0, W * 0.06, 0);
      leftGrad.addColorStop(0, 'rgba(130, 22, 60, 0.24)');
      leftGrad.addColorStop(1, 'rgba(130, 22, 60, 0)');
      ctx.fillStyle = leftGrad;
      ctx.fillRect(0, 0, W * 0.06, H);

      const rightGrad = ctx.createLinearGradient(W, 0, W * 0.94, 0);
      rightGrad.addColorStop(0, 'rgba(130, 22, 60, 0.24)');
      rightGrad.addColorStop(1, 'rgba(130, 22, 60, 0)');
      ctx.fillStyle = rightGrad;
      ctx.fillRect(W * 0.94, 0, W * 0.06, H);
    }

    /**
     * Dibuja un sello negro chileno octagonal ("ALTO EN CALORÍAS / Ministerio de Salud").
     */
    function drawChileanOctagon(ctx, cx, cy, r) {
      const traceOct = (rad) => {
        ctx.beginPath();
        for (let i = 0; i < 8; i++) {
          const a = Math.PI / 8 + (i * Math.PI) / 4;
          const px = cx + Math.cos(a) * rad;
          const py = cy + Math.sin(a) * rad;
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
      };

      ctx.save();
      traceOct(r * 1.075);
      ctx.fillStyle = '#FFFFFF';
      ctx.fill();

      traceOct(r * 1.015);
      ctx.fillStyle = '#111111';
      ctx.fill();

      traceOct(r * 0.94);
      ctx.strokeStyle = '#FFFFFF';
      ctx.lineWidth = r * 0.05;
      ctx.stroke();

      traceOct(r * 0.915);
      ctx.fillStyle = '#111111';
      ctx.fill();

      ctx.fillStyle = '#FFFFFF';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      ctx.font = `700 ${Math.round(r * 0.30)}px "Oswald", "Inter", sans-serif`;
      ctx.fillText('ALTO EN', cx, cy - r * 0.25);

      ctx.font = `700 ${Math.round(r * 0.31)}px "Oswald", "Inter", sans-serif`;
      ctx.fillText('CALORÍAS', cx, cy + r * 0.07);

      ctx.fillStyle = 'rgba(255,255,255,0.65)';
      ctx.fillRect(cx - r * 0.38, cy + r * 0.28, r * 0.76, r * 0.022);

      ctx.fillStyle = '#FFFFFF';
      ctx.font = `500 ${Math.round(r * 0.14)}px "Inter", sans-serif`;
      ctx.fillText('Ministerio', cx, cy + r * 0.44);
      ctx.fillText('de Salud', cx, cy + r * 0.59);
      ctx.restore();
    }

    /**
     * Dibuja el sello circular festoneado "EMPRESA FUNDADA POR MUJERES".
     */
    function drawWomenFoundedSeal(ctx, cx, cy, r) {
      ctx.save();
      const scallops = 18;
      ctx.beginPath();
      for (let i = 0; i <= scallops * 8; i++) {
        const a = (i / (scallops * 8)) * Math.PI * 2;
        const rad = r * (0.962 + 0.038 * Math.cos(a * scallops));
        const px = cx + Math.cos(a) * rad;
        const py = cy + Math.sin(a) * rad;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fillStyle = '#FFFFFF';
      ctx.fill();
      ctx.lineWidth = 6;
      ctx.strokeStyle = '#F7CAD9';
      ctx.stroke();

      // Emblema rosa central (corazón con carita/gomita suave)
      drawHeart(ctx, cx, cy + r * 0.04, r * 0.72, BRAND.pinkLogo);

      // Texto perimetral
      ctx.fillStyle = '#2B1D25';
      ctx.font = `800 ${Math.round(r * 0.175)}px "Inter", sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      drawCurvedText(ctx, 'EMPRESA FUNDADA', cx, cy, r * 0.73, -1.34, 1.34, false);
      drawCurvedText(ctx, 'POR MUJERES', cx, cy, r * 0.74, 1.06, -1.06, true);

      // Puntos separadores laterales
      ctx.beginPath();
      ctx.arc(cx - r * 0.73, cy + r * 0.04, r * 0.032, 0, Math.PI * 2);
      ctx.arc(cx + r * 0.73, cy + r * 0.04, r * 0.032, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    /**
     * Crea las texturas de la CARA FRONTAL (2048×3072): color + mapa alfa (ventana riñón + Euro-slot).
     */
    function createFrontTextures() {
      const W = 2048;
      const H = 3072;

      const colorCanvas = document.createElement('canvas');
      colorCanvas.width = W;
      colorCanvas.height = H;
      const ctx = colorCanvas.getContext('2d');

      drawCandyPouchBackground(ctx, W, H, 23);

      // Tres sellos negros chilenos en la parte superior derecha (2 arriba, 1 abajo-derecha)
      const octR = 136;
      drawChileanOctagon(ctx, W * 0.685, H * 0.242, octR);
      drawChileanOctagon(ctx, W * 0.855, H * 0.242, octR);
      drawChileanOctagon(ctx, W * 0.855, H * 0.352, octR);

      // Logotipo vectorial fiel GOMANÍA centrado con leve inclinación (-3°)
      drawGomaniaVectorLogo(ctx, W * 0.438, H * 0.455, 1.24, -0.052);

      // Reborde fino blanco-rosado que enmarca el troquel de la ventana riñón
      ctx.save();
      traceKidneyWindow2D(ctx, W, H, 1.012);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.32)';
      ctx.lineWidth = 10;
      ctx.stroke();
      ctx.restore();

      // Texto EXPLÍCITO y totalmente despejado: "80gr" y debajo "Peso neto"
      ctx.save();
      ctx.fillStyle = '#FFFFFF';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = 'rgba(138, 22, 62, 0.25)';
      ctx.shadowBlur = 10;
      ctx.shadowOffsetY = 4;

      // Posicionado en la zona rosa inferior derecha, completamente a la derecha de la ventana
      const weightX = W * 0.822;
      const weightY = H * 0.798;
      ctx.font = '700 118px "Fredoka", "Inter", sans-serif';
      ctx.fillText('80gr', weightX, weightY);

      ctx.shadowBlur = 6;
      ctx.font = '700 44px "Inter", sans-serif';
      ctx.fillText('Peso neto', weightX, weightY + 86);
      ctx.restore();

      // Insignia "EMPRESA FUNDADA POR MUJERES" en la esquina inferior izquierda de la ventana
      const badgeCx = POUCH.badge.u * W;
      const badgeCy = (1.0 - POUCH.badge.v) * H;
      const badgeR = POUCH.badge.rU * W;
      drawWomenFoundedSeal(ctx, badgeCx, badgeCy, badgeR);

      // --- MAPA ALFA FRONTAL (blanco = opaco, negro = recorte real transparente) ---
      const alphaCanvas = document.createElement('canvas');
      alphaCanvas.width = W;
      alphaCanvas.height = H;
      const aCtx = alphaCanvas.getContext('2d');

      aCtx.fillStyle = '#FFFFFF';
      aCtx.fillRect(0, 0, W, H);

      // Recorte real de la ventana riñón
      traceKidneyWindow2D(aCtx, W, H, 1.0);
      aCtx.fillStyle = '#000000';
      aCtx.fill();

      // Restaurar opacidad donde el sello "EMPRESA FUNDADA POR MUJERES" se superpone al borde
      aCtx.beginPath();
      aCtx.arc(badgeCx, badgeCy, badgeR * 0.99, 0, Math.PI * 2);
      aCtx.fillStyle = '#FFFFFF';
      aCtx.fill();

      // Recorte real de la perforación Euro-slot en el cabezal superior
      traceEuroHole2D(aCtx, W, H);
      aCtx.fillStyle = '#000000';
      aCtx.fill();

      const colorTex = new THREE.CanvasTexture(colorCanvas);
      colorTex.colorSpace = THREE.SRGBColorSpace;
      colorTex.anisotropy = 16;

      const alphaTex = new THREE.CanvasTexture(alphaCanvas);
      alphaTex.anisotropy = 8;

      return { colorTex, alphaTex };
    }

    /**
     * Dibuja un código QR nítido en color celeste de marca (#0093C4).
     */
    function drawCyanQRCode(ctx, x, y, size) {
      const cells = 21;
      const cell = size / cells;
      ctx.save();
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(x - 10, y - 10, size + 20, size + 20);
      ctx.fillStyle = BRAND.cyan;

      const drawFinder = (gx, gy) => {
        ctx.fillRect(x + gx * cell, y + gy * cell, 7 * cell, 7 * cell);
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(x + (gx + 1) * cell, y + (gy + 1) * cell, 5 * cell, 5 * cell);
        ctx.fillStyle = BRAND.cyan;
        ctx.fillRect(x + (gx + 2) * cell, y + (gy + 2) * cell, 3 * cell, 3 * cell);
      };

      drawFinder(0, 0);
      drawFinder(cells - 7, 0);
      drawFinder(0, cells - 7);

      let s = 90210;
      const rand = () => {
        s = (s * 16807) % 2147483647;
        return (s - 1) / 2147483646;
      };

      for (let r = 0; r < cells; r++) {
        for (let c = 0; c < cells; c++) {
          const inTL = r < 8 && c < 8;
          const inTR = r < 8 && c >= cells - 8;
          const inBL = r >= cells - 8 && c < 8;
          if (inTL || inTR || inBL) continue;
          if (r === 6 || c === 6) {
            if ((r + c) % 2 === 0) ctx.fillRect(x + c * cell, y + r * cell, Math.ceil(cell), Math.ceil(cell));
            continue;
          }
          if (rand() > 0.48) {
            ctx.fillRect(x + c * cell, y + r * cell, Math.ceil(cell), Math.ceil(cell));
          }
        }
      }
      ctx.restore();
    }

    function createBlueGussetTexture() {

      ctx.fillText('RES. SANITARIA SEREMI DE SALUD · VER VENCIMIENTO EN ENVASE.', W * 0.36, H * 0.67);
      ctx.restore();

      // Bloque derecho superior: Bandera de Chile + "ENVASADO EN CHILE"
      const fx = W * 0.70;
      const fy = H * 0.25;
      const fw = 112;
      const fh = 72;

      ctx.fillRect(fx - 4, fy - 4, fw + 8, fh + 8);

    /**
     * Mapa de relieve (bumpMap) de la lámina Doypack: estrías en bordes termosellados y cremallera.
     */
    function createPouchBumpTexture() {
      const W = 1024;
      const H = 1536;
      const canvas = document.createElement('canvas');
      canvas.width = W;
      canvas.height = H;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#808080';
      ctx.fillRect(0, 0, W, H);

      // Micro-ondulaciones muy suaves del laminado flexible
      let s = 555;
      const rand = () => {
        s = (s * 16807) % 2147483647;
        return (s - 1) / 2147483646;
      };
      for (let i = 0; i < 36; i++) {
        const gx = rand() * W;
        const gy = rand() * H;
        const gr = 70 + rand() * 170;
        const g = ctx.createRadialGradient(gx, gy, 0, gx, gy, gr);
        const lum = i % 2 === 0 ? 140 : 116;
        g.addColorStop(0, `rgba(${lum},${lum},${lum},0.14)`);
        g.addColorStop(1, 'rgba(128,128,128,0)');
        ctx.fillStyle = g;
        ctx.fillRect(gx - gr, gy - gr, gr * 2, gr * 2);
      }

      // Estrías del sellado térmico en bordes izquierdo y derecho
      const sealPx = Math.floor(W * (1 - POUCH.sideSealNx) * 0.5);
      for (let y = 0; y < H; y += 6) {
        ctx.fillStyle = (y / 6) % 2 === 0 ? '#ACACAC' : '#565656';
        ctx.fillRect(0, y, sealPx, 3);
        ctx.fillRect(W - sealPx, y, sealPx, 3);
      }

      // Estrías superiores
      const topSealPx = Math.floor(H * 0.038);
      for (let x = 0; x < W; x += 6) {
        ctx.fillStyle = (x / 6) % 2 === 0 ? '#ACACAC' : '#565656';
        ctx.fillRect(x, 0, 3, topSealPx);
      }

      // Relieve doble horizontal de la cremallera zip-lock
      const zipV = (POUCH.zipNy + 1) * 0.5;
      const zipY = (1 - zipV) * H;
      ctx.fillStyle = '#DEDEDE';
      ctx.fillRect(sealPx, zipY - 8, W - sealPx * 2, 5);
      ctx.fillStyle = '#4A4A4A';
      ctx.fillRect(sealPx, zipY - 2, W - sealPx * 2, 4);
      ctx.fillStyle = '#D8D8D8';
      ctx.fillRect(sealPx, zipY + 4, W - sealPx * 2, 5);

      const tex = new THREE.CanvasTexture(canvas);
      tex.anisotropy = 8;
      return tex;
    }

    /**
     * Microtextura polvosa/aterciopelada para la superficie de los malvaviscos.
     */
    function createSugarPowderBumpTexture() {
      const S = 256;
      const canvas = document.createElement('canvas');
      canvas.width = S;
      canvas.height = S;
      const ctx = canvas.getContext('2d');
      const img = ctx.createImageData(S, S);
      const data = img.data;

      let s = 314159;
      for (let i = 0; i < data.length; i += 4) {
        s = (s * 16807) % 2147483647;
        const v = 110 + (s % 46);
        data[i] = v;
        data[i + 1] = v;
        data[i + 2] = v;
        data[i + 3] = 255;
      }
      ctx.putImageData(img, 0, 0);

      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(3, 3);
      return tex;
    }

     * Sombra radial muy suave de contacto sobre el suelo blanco puro.

    function createContactShadowTexture() {

    // 6. CONSTRUCCIÓN DE GEOMETRÍAS 3D DEL PAQUETE DOYPACK

    /**
     * Construye el panel frontal o trasero esculpido con `getPouchHalfDepth(nx, ny)`.
     */
    function buildPouchPanelGeometry(isBack, segU = 92, segV = 128, zOffset = 0, uMin = 0, uMax = 1, vMin = 0, vMax = 1) {
      const positions = [];
      const uvs = [];
      const indices = [];

      for (let j = 0; j <= segV; j++) {
        const v = vMin + (j / segV) * (vMax - vMin);
        const ny = v * 2.0 - 1.0;
        for (let i = 0; i <= segU; i++) {
          const u = uMin + (i / segU) * (uMax - uMin);
          // En la cara trasera invertimos nx para que la textura se lea de izquierda a derecha al rotarla
          const nx = isBack ? (1.0 - u) * 2.0 - 1.0 : u * 2.0 - 1.0;
          const { x, y } = getPouchLocalXY(nx, ny);
          const halfZ = getPouchHalfDepth(nx, ny) + zOffset;
          const z = isBack ? -halfZ : halfZ;

          positions.push(x, y, z);
          uvs.push(u, v);
        }
      }

      const row = segU + 1;
      for (let j = 0; j < segV; j++) {
        for (let i = 0; i < segU; i++) {
          const a = j * row + i;
          const b = a + 1;
          const c = a + row;
          const d = c + 1;
          indices.push(a, b, d, a, d, c);
        }
      }

      const geom = new THREE.BufferGeometry();
      geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geom.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geom.setIndex(indices);
      geom.computeVertexNormals();
      return geom;
    }

    /**
     * Construye el fuelle inferior elíptico doblado hacia adentro (Bottom Gusset) en color celeste.
     */
    function buildBottomGussetGeometry(segU = 92, segS = 28) {
      const positions = [];
      const uvs = [];
      const indices = [];

      for (let j = 0; j <= segS; j++) {
        const s = j / segS; // 0 = borde frontal, 1 = borde trasero
        for (let i = 0; i <= segU; i++) {
          const u = i / segU;
          const nx = u * 2.0 - 1.0;
          const { x } = getPouchLocalXY(nx, -1.0);
          const halfZ = getPouchHalfDepth(nx, -1.0);
          const z = halfZ * (1.0 - 2.0 * s);
          const y = getGussetLocalY(nx, s);

          positions.push(x, y, z);
          uvs.push(u, 1.0 - s);
        }
      }

      const row = segU + 1;
      for (let j = 0; j < segS; j++) {
        for (let i = 0; i < segU; i++) {
          const a = j * row + i;
          const b = a + 1;
          const c = a + row;
          const d = c + 1;
          // Normales apuntando hacia abajo (-Y) para que se ilumine al girar la base
          indices.push(a, d, b, a, c, d);
        }
      }

      const geom = new THREE.BufferGeometry();
      geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geom.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geom.setIndex(indices);
      geom.computeVertexNormals();
      return geom;
    }

    /**
     * Cierra herméticamente los delgados cantos termosellados (izquierdo, superior y derecho).
     */
    function buildSeamEdgesGeometry(segU = 92, segV = 128) {
      const positions = [];
      const uvs = [];
      const indices = [];
      let vIdx = 0;

      const addStrip = (sampleFn, count) => {
        const start = vIdx;
        for (let i = 0; i <= count; i++) {
          const t = i / count;
          const { nx, ny } = sampleFn(t);
          const { x, y } = getPouchLocalXY(nx, ny);
          const z = getPouchHalfDepth(nx, ny);
          positions.push(x, y, z);
          uvs.push(t, 0);
          positions.push(x, y, -z);
          uvs.push(t, 1);
          vIdx += 2;
        }
        for (let i = 0; i < count; i++) {
          const a = start + i * 2;
          const b = a + 1;
          const c = a + 2;
          const d = a + 3;
          indices.push(a, c, d, a, d, b);
        }
      };

      addStrip((t) => ({ nx: -1, ny: -1 + t * 2 }), segV);
      addStrip((t) => ({ nx: -1 + t * 2, ny: 1 }), segU);
      addStrip((t) => ({ nx: 1, ny: 1 - t * 2 }), segV);

      const geom = new THREE.BufferGeometry();
      geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geom.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geom.setIndex(indices);
      geom.computeVertexNormals();
      return geom;
    }

    /**
     * Construye el espesor 3D del canto interior de la perforación superior Euro-slot (sombrero).
     */
    function buildEuroHoleRimGeometry() {
      const pts = getEuroHolePointsUV();
      const positions = [];
      const indices = [];
      const n = pts.length;

      for (let i = 0; i < n; i++) {
        const nx = pts[i].u * 2.0 - 1.0;
        const ny = pts[i].v * 2.0 - 1.0;
        const { x, y } = getPouchLocalXY(nx, ny);
        const z = getPouchHalfDepth(nx, ny);
        positions.push(x, y, z);
        positions.push(x, y, -z);
      }

      for (let i = 0; i < n; i++) {
        const next = (i + 1) % n;
        const a = i * 2;
        const b = a + 1;
        const c = next * 2;
        const d = next * 2 + 1;
        indices.push(a, d, c, a, b, d);
      }

      const geom = new THREE.BufferGeometry();
      geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geom.setIndex(indices);
      geom.computeVertexNormals();
      return geom;
    }

    /**
     * Geometría de malvavisco esponjoso almohadillado con bordes redondeados suaves.
     */
    function createMarshmallowGeometry() {
      const radius = 0.106;
      const halfLen = 0.118;
      const pts = [];

      // Cara inferior con levísima depresión central
      pts.push(new THREE.Vector2(0.0, -halfLen * 0.96));
      pts.push(new THREE.Vector2(radius * 0.48, -halfLen * 0.985));
      pts.push(new THREE.Vector2(radius * 0.72, -halfLen));

      // Bisel inferior suave
      const cr = radius * 0.30;
      for (let i = 0; i <= 7; i++) {
        const a = -Math.PI * 0.5 + (i / 7) * (Math.PI * 0.5);
        pts.push(new THREE.Vector2(radius - cr + Math.cos(a) * cr, -halfLen + cr + Math.sin(a) * cr));
      }

      // Barril suavemente abombado
      for (let i = 1; i < 6; i++) {
        const t = i / 6;
        const y = -halfLen + cr + t * (2 * (halfLen - cr));
        const bulge = Math.sin(t * Math.PI) * 0.007;
        pts.push(new THREE.Vector2(radius + bulge, y));
      }

      // Bisel superior suave
      for (let i = 0; i <= 7; i++) {
        const a = (i / 7) * (Math.PI * 0.5);
        pts.push(new THREE.Vector2(radius - cr + Math.cos(a) * cr, halfLen - cr + Math.sin(a) * cr));
      }

      // Cara superior
      pts.push(new THREE.Vector2(radius * 0.72, halfLen));
      pts.push(new THREE.Vector2(radius * 0.48, halfLen * 0.985));
      pts.push(new THREE.Vector2(0.0, halfLen * 0.96));

      const geom = new THREE.LatheGeometry(pts, 28);
      geom.computeVertexNormals();
      return geom;
    }

    // =========================================================================
    // 7. EMPAQUETADO DE MALVAVISCOS CON CONTENCIÓN 3D MATEMÁTICAMENTE GARANTIZADA
    //    (CERO PROTRUSIONES POR EL FRENTE, LADOS, DORSO NI BASE)
    // =========================================================================

    function populateMarshmallowsStrictlyInside(parentGroup) {
      const mallowGeom = createMarshmallowGeometry();
      const sugarBump = createSugarPowderBumpTexture();

      // Precomputar los vértices base de la malla para auditoría exacta vértice por vértice
      const posAttr = mallowGeom.attributes.position;
      const sampleVerts = [];
      for (let i = 0; i < posAttr.count; i += 2) {
        sampleVerts.push(new THREE.Vector3().fromBufferAttribute(posAttr, i));
      }
      // Radio exacto de la esfera circunscrita del malvavisco base (sin escalar)
      let baseBoundingRadius = 0;
      for (let i = 0; i < posAttr.count; i++) {
        const vx = posAttr.getX(i);
        const vy = posAttr.getY(i);
        const vz = posAttr.getZ(i);
        const d = Math.hypot(vx, vy, vz);
        if (d > baseBoundingRadius) baseBoundingRadius = d;
      }

      let seed = 20261126;
      const rand = () => {
        seed = (seed * 16807) % 2147483647;
        return (seed - 1) / 2147483646;
      };

      // Evalúa la semiprofundidad mínima en el centro + 8 puntos perimetrales (mx ± R, my ± R)
      const getMinSampledHalfDepth = (mx, my, R) => {
        let minHD = Infinity;
        const deltas = [-R, 0, R];
        for (let ix = 0; ix < 3; ix++) {
          for (let iy = 0; iy < 3; iy++) {
            const nx = (mx + deltas[ix]) / POUCH.halfW;
            const ny = (my + deltas[iy]) / POUCH.halfH;
            if (Math.abs(nx) >= POUCH.sideSealNx || ny <= -0.99 || ny >= POUCH.topBellyNy) {
              return 0;
            }
            const hd = getPouchHalfDepth(nx, ny);
            if (hd < minHD) minHD = hd;
          }
        }
        return minHD;
      };

      // Altura máxima del arco del fuelle debajo de un malvavisco en (mx, R)
      const getMaxGussetBelow = (mx, R) => {
        let maxGY = -POUCH.halfH;
        const offsets = [-R, 0, R];
        for (const dx of offsets) {
          const nx = THREE.MathUtils.clamp((mx + dx) / POUCH.halfW, -0.98, 0.98);
          const gy = getGussetLocalY(nx, 0.5);
          if (gy > maxGY) maxGY = gy;
        }
        return maxGY;
      };

      // Verifica y restringe un malvavisco a la cavidad segura estricta
      const enforceSafeContainment = (item) => {
        const R = item.radius;

        // 1. Límites X e Y estrictamente detrás de la ventana (lejos de "80gr" y sellados laterales)
        item.pos.x = THREE.MathUtils.clamp(item.pos.x, -0.82, 0.64);
        item.pos.y = THREE.MathUtils.clamp(item.pos.y, -1.46, -0.22);

        // 2. Despeje garantizado sobre el arco interior del fuelle inferior celeste
        const minSafeY = getMaxGussetBelow(item.pos.x, R) + R + 0.045;
        if (item.pos.y < minSafeY) item.pos.y = minSafeY;

        // 3. Si en los bordes laterales la bolsa es demasiado estrecha, acercar suavemente hacia el centro
        let minHD = getMinSampledHalfDepth(item.pos.x, item.pos.y, R);
        let tries = 0;
        while (minHD <= R + 0.06 && tries < 24) {
          item.pos.x *= 0.92;
          item.pos.y = THREE.MathUtils.lerp(item.pos.y, -0.95, 0.12);
          minHD = getMinSampledHalfDepth(item.pos.x, item.pos.y, R);
          tries++;
        }

        // 4. Límite estricto en Z: |mz| + R < minSampledHalfDepth - 0.045
        const maxAllowedZ = Math.max(0.0, minHD - R - 0.045);
        item.pos.z = THREE.MathUtils.clamp(item.pos.z, -maxAllowedZ, maxAllowedZ);
      };

      const candidates = [];

      // Capa 1 (Frontal: 20 malvaviscos gorditos pegados de forma segura detrás del film de la ventana)
      const frontCols = 5;
      const frontRows = 4;
      for (let r = 0; r < frontRows; r++) {
        for (let c = 0; c < frontCols; c++) {
          const mx = -0.70 + (c / (frontCols - 1)) * 1.24 + (rand() - 0.5) * 0.08;
          const my = -1.40 + (r / (frontRows - 1)) * 1.02 + (rand() - 0.5) * 0.07;
          const sR = 0.88 + rand() * 0.16;
          const sL = 0.88 + rand() * 0.18;
          const R = baseBoundingRadius * Math.max(sR, sL) * 1.02;

          const item = {
            pos: new THREE.Vector3(mx, my, 0.25),
            rot: new THREE.Euler(rand() * Math.PI, rand() * Math.PI, rand() * Math.PI),
            scale: new THREE.Vector3(sR, sL, sR),
            radius: R,
            layer: 0
          };
          enforceSafeContainment(item);
          candidates.push(item);
        }
      }

      // Capa 2 (Central: 14 malvaviscos rellenando huecos y creando volumen 3D)
      for (let i = 0; i < 14; i++) {
        const col = i % 5;
        const row = Math.floor(i / 5);
        const mx = -0.62 + (col / 4) * 1.12 + (rand() - 0.5) * 0.12;
        const my = -1.36 + (row / 2) * 0.96 + (rand() - 0.5) * 0.10;
        const sR = 0.86 + rand() * 0.16;
        const sL = 0.86 + rand() * 0.18;
        const R = baseBoundingRadius * Math.max(sR, sL) * 1.02;

        const item = {
          pos: new THREE.Vector3(mx, my, 0.02 + (rand() - 0.5) * 0.08),
          rot: new THREE.Euler(rand() * Math.PI, rand() * Math.PI, rand() * Math.PI),
          scale: new THREE.Vector3(sR, sL, sR),
          radius: R,
          layer: 1
        };
        enforceSafeContainment(item);
        candidates.push(item);
      }

      // Capa 3 (Fondo interior: 12 malvaviscos para profundidad real al mirar en diagonal)
      for (let i = 0; i < 12; i++) {
        const col = i % 4;
        const row = Math.floor(i / 4);
        const mx = -0.54 + (col / 3) * 0.96 + (rand() - 0.5) * 0.12;
        const my = -1.32 + (row / 2) * 0.92 + (rand() - 0.5) * 0.10;
        const sR = 0.86 + rand() * 0.16;
        const sL = 0.86 + rand() * 0.16;
        const R = baseBoundingRadius * Math.max(sR, sL) * 1.02;

        const item = {
          pos: new THREE.Vector3(mx, my, -0.18),
          rot: new THREE.Euler(rand() * Math.PI, rand() * Math.PI, rand() * Math.PI),
          scale: new THREE.Vector3(sR, sL, sR),
          radius: R,
          layer: 2
        };
        enforceSafeContainment(item);
        candidates.push(item);
      }

      // Relajación iterativa suave para acomodar los 46 malvaviscos apretados y orgánicos
      const diff = new THREE.Vector3();
      for (let iter = 0; iter < 55; iter++) {
        for (let i = 0; i < candidates.length; i++) {
          for (let j = i + 1; j < candidates.length; j++) {
            diff.subVectors(candidates[i].pos, candidates[j].pos);
            const dist = diff.length();
            const minDist = (candidates[i].radius + candidates[j].radius) * 0.84;
            if (dist > 0.0001 && dist < minDist) {
              const push = (minDist - dist) * 0.36;
              diff.normalize().multiplyScalar(push);
              candidates[i].pos.add(diff);
              candidates[j].pos.sub(diff);
            }
          }
        }
        // Mantener la capa frontal suavemente atraída hacia la ventana sin cruzar nunca el margen seguro
        for (const it of candidates) {
          if (it.layer === 0) it.pos.z += 0.009;
          if (it.layer === 2) it.pos.z -= 0.004;
          enforceSafeContainment(it);
        }
      }

      // AUDITORÍA ABSOLUTA VÉRTICE POR VÉRTICE: verifica cada malla rotada contra la superficie 3D exacta
      const mat4 = new THREE.Matrix4();
      const quat = new THREE.Quaternion();
      const vWorld = new THREE.Vector3();
      const marshmallows = [];

      const isMeshStrictlyInside = (item) => {
        quat.setFromEuler(item.rot);
        mat4.compose(item.pos, quat, item.scale);

        for (let k = 0; k < sampleVerts.length; k++) {
          vWorld.copy(sampleVerts[k]).applyMatrix4(mat4);
          const nx = vWorld.x / POUCH.halfW;
          const ny = vWorld.y / POUCH.halfH;

          // Verificar márgenes laterales y superior/inferior
          if (Math.abs(nx) > POUCH.sideSealNx - 0.05) return false;
          if (ny > POUCH.topBellyNy - 0.08 || ny < -0.96) return false;

          // Verificar distancia segura a la pared frontal y trasera reales
          const surfaceZ = getPouchHalfDepth(nx, ny);
          if (Math.abs(vWorld.z) > surfaceZ - 0.032) return false;

          // Verificar que ningún vértice toque o atraviese el fuelle celeste inferior
          const sApprox = THREE.MathUtils.clamp((surfaceZ - vWorld.z) / (2 * surfaceZ), 0, 1);
          const gussetY = getGussetLocalY(nx, sApprox);
          if (vWorld.y < gussetY + 0.032) return false;
        }
        return true;
      };

      candidates.forEach((it, idx) => {
        // Si por rotación extrema un vértice estuviera cerca, empujar ligeramente hacia el centro de la cavidad
        let safe = isMeshStrictlyInside(it);
        let guard = 0;
        while (!safe && guard < 18) {
          it.pos.x *= 0.94;
          it.pos.z *= 0.88;
          it.pos.y = THREE.MathUtils.lerp(it.pos.y, -0.88, 0.12);
          enforceSafeContainment(it);
          safe = isMeshStrictlyInside(it);
          guard++;
        }
        if (!safe) return;

        // Secuencia independiente de colores pastel para cada malvavisco
        const sequence = PASTEL_PALETTE.map((_, i) => i);
        for (let k = sequence.length - 1; k > 0; k--) {
          const swap = Math.floor(rand() * (k + 1));
          [sequence[k], sequence[swap]] = [sequence[swap], sequence[k]];
        }

        const mat = new THREE.MeshPhysicalMaterial({
          color: PASTEL_PALETTE[sequence[0]].clone(),
          roughness: 0.92,
          metalness: 0.0,
          sheen: 0.42,
          sheenRoughness: 0.88,
          sheenColor: new THREE.Color('#FFFFFF'),
          bumpMap: sugarBump,
          bumpScale: 0.004
        });

        const mesh = new THREE.Mesh(mallowGeom, mat);
        mesh.position.copy(it.pos);
        mesh.rotation.copy(it.rot);
        mesh.scale.copy(it.scale);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        parentGroup.add(mesh);

        marshmallows.push({
          mesh,
          material: mat,
          sequence,
          phase: rand() * sequence.length + idx * 0.21,
          speedFactor: 0.65 + rand() * 0.55
        });
      });

      return marshmallows;
    }

    // =========================================================================

        roughness: 0.65,
        metalness: 0.1,
        side: THREE.BackSide
      });
      const innerGussetMesh = new THREE.Mesh(buildBottomGussetGeometry(48, 16), innerGussetMat);
      innerGussetMesh.position.y = 0.008;
      pouchGroup.add(innerGussetMesh);

      // 6. Malvaviscos 3D pastel estrictamente contenidos dentro de la cavidad de la bolsa
      const marshmallows = populateMarshmallowsStrictlyInside(pouchGroup);

      // 7. Lámina de plástico transparente brillante sobre la abertura de la ventana riñón
      const clearWindowGeom = buildPouchPanelGeometry(
        false,
        52,
        40,
        -0.0025, // Sutilmente detrás del borde impreso
        0.13,
        0.76,
        0.10,
        0.42
      );
      const clearFilmMat = new THREE.MeshPhysicalMaterial({
        color: new THREE.Color('#FFFFFF'),
        transparent: true,
        opacity: 0.13,
        roughness: 0.05,
        metalness: 0.0,
        clearcoat: 1.0,
        clearcoatRoughness: 0.04,
        reflectivity: 0.9,
        envMapIntensity: 1.55,
        depthWrite: false
      });
      const clearFilmMesh = new THREE.Mesh(clearWindowGeom, clearFilmMat);
      clearFilmMesh.renderOrder = 2;
      pouchGroup.add(clearFilmMesh);

      // =======================================================================
      // CONTROLES DE ÓRBITA 360° Y BOTONES DE VISTA RÁPIDA
      // =======================================================================
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.target.copy(HERO_TARGET);
      controls.enableDamping = true;
      controls.dampingFactor = 0.055;
      controls.enablePan = false;
      controls.minDistance = 2.8;
      controls.maxDistance = 10.5;
      controls.minPolarAngle = 0.08;
      controls.maxPolarAngle = Math.PI - 0.08;
      controls.autoRotate = state.autoRotate;
      controls.autoRotateSpeed = 1.05;
      controls.update();

      const dragHint = document.getElementById('drag-hint');
      controls.addEventListener('start', () => {
        if (dragHint) dragHint.style.opacity = '0';
        state.cameraAnim = null; // Cancelar transición si el usuario arrastra manualmente
      });

      // Helper para animar la cámara suavemente hacia una vista predefinida
      const animateCameraTo = (targetPos, targetLookAt, disableAutoRotate = true) => {
        if (disableAutoRotate && state.autoRotate) {
          setAutoRotate(false);
        }
        state.cameraAnim = {
          startPos: camera.position.clone(),
          endPos: targetPos.clone(),
          startTarget: controls.target.clone(),
          endTarget: targetLookAt.clone(),
          elapsed: 0,
          duration: 0.72
        };
      };

      const btnAutoRotate = document.getElementById('btn-autorotate');
      const setAutoRotate = (enabled) => {
        state.autoRotate = enabled;
        controls.autoRotate = enabled;
        if (enabled) {
          btnAutoRotate.className =
            'flex items-center gap-1.5 px-2.5 sm:px-3 py-1.5 rounded-full text-xs font-medium transition-all duration-200 bg-pink-50 text-[#D93D6B] border border-pink-200/80 hover:bg-pink-100/80 active:scale-95 cursor-pointer';
        } else {
          btnAutoRotate.className =
            'flex items-center gap-1.5 px-2.5 sm:px-3 py-1.5 rounded-full text-xs font-medium transition-all duration-200 bg-slate-50 text-slate-600 border border-slate-200/80 hover:bg-slate-100 active:scale-95 cursor-pointer';
        }
      };

      btnAutoRotate.addEventListener('click', () => setAutoRotate(!state.autoRotate));

      const btnColors = document.getElementById('btn-colors');
      const iconPause = document.getElementById('icon-pause');
      const iconPlay = document.getElementById('icon-play');
      const labelColors = document.getElementById('label-colors');

      btnColors.addEventListener('click', () => {
        state.animateColors = !state.animateColors;
        if (state.animateColors) {
          iconPause.classList.remove('hidden');
          iconPlay.classList.add('hidden');
          labelColors.textContent = 'Pausar';
        } else {
          iconPause.classList.add('hidden');
          iconPlay.classList.remove('hidden');
          labelColors.textContent = 'Reanudar';
        }
      });

      const speedSlider = document.getElementById('speed-slider');
      speedSlider.addEventListener('input', (e) => {
        state.colorSpeed = parseFloat(e.target.value);
      });

      document.querySelectorAll('.view-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const view = btn.dataset.view;
          if (view === 'front') {
            animateCameraTo(new THREE.Vector3(0, 2.0, 6.75), HERO_TARGET, true);
          } else if (view === 'back') {
            animateCameraTo(new THREE.Vector3(0, 2.0, -6.75), HERO_TARGET, true);
          } else if (view === 'bottom') {
            // Vista inclinada hacia abajo para inspeccionar el fuelle inferior celeste
            animateCameraTo(new THREE.Vector3(0.4, -2.55, 4.65), new THREE.Vector3(0, 0.65, 0), true);
          } else if (view === 'reset') {
            animateCameraTo(HERO_CAM_POS, HERO_TARGET, false);
            setAutoRotate(true);
          }
        });
      });

      // Ajuste responsivo para escritorio y pantallas móviles verticales
      const handleResize = () => {
        const w = window.innerWidth;
        const h = window.innerHeight;
        camera.aspect = w / h;
        const isPortrait = h > w * 1.15;
        camera.fov = isPortrait ? 41 : 34;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
      };
      window.addEventListener('resize', handleResize);
      handleResize();

      // Ocultar loader suavemente
      const loader = document.getElementById('loader');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(() => loader.remove(), 500);
      }

      // =======================================================================
      // BUCLE DE ANIMACIÓN A 60 FPS (SOLO LOS MALVAVISCOS CAMBIAN DE COLOR)
      // =======================================================================
      const clock = new THREE.Clock();

      function animate() {
        requestAnimationFrame(animate);
        const dt = Math.min(clock.getDelta(), 0.05);

        // Transición suave de colores pastel exclusivamente en los malvaviscos
        if (state.animateColors) {
          state.colorTime += dt * 0.44 * state.colorSpeed;
          const nColors = PASTEL_PALETTE.length;

          for (let i = 0; i < marshmallows.length; i++) {
            const m = marshmallows[i];
            const prog = m.phase + state.colorTime * m.speedFactor;
            const idxA = Math.floor(prog) % nColors;
            const idxB = (idxA + 1) % nColors;
            const frac = prog - Math.floor(prog);
            const smoothT = 0.5 - 0.5 * Math.cos(frac * Math.PI);

            m.material.color.lerpColors(
              PASTEL_PALETTE[m.sequence[idxA]],
              PASTEL_PALETTE[m.sequence[idxB]],
              smoothT
            );
          }
        }

        // Interpolación suave de cámara para botones de vista rápida
        if (state.cameraAnim) {
          const anim = state.cameraAnim;
          anim.elapsed += dt;
          const t = Math.min(1, anim.elapsed / anim.duration);
          // Easing cúbico suave
          const ease = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
          camera.position.lerpVectors(anim.startPos, anim.endPos, ease);
          controls.target.lerpVectors(anim.startTarget, anim.endTarget, ease);
          if (t >= 1) state.cameraAnim = null;
        }

        controls.update();
        renderer.render(scene, camera);
      }

      animate();
    }

    window.onload = () => {
      initStudio().catch((err) => {
        console.error('Error al inicializar el visor 3D GOMANÍA:', err);
      });
    };
  </script>
</body>
</html>
